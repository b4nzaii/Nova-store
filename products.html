<!DOCTYPE html>
<html lang="sv">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkter | Nova-store</title>
    <link rel="stylesheet" href="css/base.css">

    <link rel="stylesheet" href="css/products.css">
    </head>
    <body>
    <a href="#main" class="skip-link">Hoppa till innehållet</a>

    <header class="site-header">
        <a href="index.html" class="logo">Nova-store</a>

        <button class="menu-button" aria-expanded="false" aria-controls="site-nav">
        Meny
        </button>

        <nav id="site-nav" class="site-nav">
        <ul>
            <li><a href="index.html">Hem</a></li>
            <li><a href="products.html" aria-current="page">Produkter</a></li>
            <li><a href="favorites.html">Favoriter</a></li>
            <li><a href="cart.html">Varukorg</a></li>
            <li><a href="admin.html">Admin</a></li>
        </ul>
        </nav>
    </header>
<main id="main">
    <h1>Produkter</h1>
    <section class="product-tools" aria-label="Sök och filtrera produkter">
        <div class="product-tool">
            <label for="product-search">Sök produkt</label>
            <input
                type="search"
                id="product-search"
                placeholder="Sök efter produktnamn..."
            >
        </div>
        <div class="product-tool">
            <label for="category-filter">Kategori</label>
            <select id="category-filter">
                <option value="all">Alla kategorier</option>
                <option value="smartphones">Mobiler</option>
                <option value="laptops">Datorer</option>
                <option value="tablets">Surfplattor</option>
                <option value="mobile-accessories">Tillbehör</option>
            </select>
        </div>
        <div class="product-tool">
            <label for="price-sort">Sortera efter</label>
            <select id="price-sort">
                <option value="default">Standardordning</option>
                <option value="price-low">Lägsta pris först</option>
                <option value="price-high">Högsta pris först</option>
            </select>
        </div>
    </section>
    <p id="status-message" aria-live="polite"></p>
    <p id="result-count" role="status" aria-live="polite"></p>
   
    <div id="product-list" class="product-list"></div>
</main>
 
    <footer class="site-footer">
        <p>© 2026 Nova-store</p>
    </footer>

    <script src="js/main.js"></script>

    <script src="js/api.js"></script>
    <script src="js/products.js"></script>
    </body>
</html>
